name: Plugin Quality

on:
  workflow_call:

permissions:
  contents: read

# Workflow tests need a real Zotero; they run locally with
# `npm run test:workflow`, not here.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint:check

  typecheck:
    name: Typecheck and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The skill-hash check reads every release tag and its history.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Check retired tool names
        run: npm run check:tool-vocabulary
      - name: Check skill hashes
        run: npm run check:skill-hashes
      - name: Check architecture layers
        run: npm run check:architecture
      - name: Check import cycles
        run: npm run check:cycles

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build

  full-test:
    # Kept under its old name so branch rules that require it still match.
    # It used to run every test a second time; now it only checks that every
    # job above passed.
    name: Full npm test gate
    if: always()
    needs:
      - lint
      - typecheck
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job did not pass."
              exit 1
            fi
          done
